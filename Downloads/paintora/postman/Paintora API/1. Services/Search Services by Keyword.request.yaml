$kind: http-request
description: Searches services by title or description matching query.
url: "{{base_url}}/services.php?search=interior"
method: GET
queryParams:
  search: interior
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Search results contain matched services", function () {
          var json = pm.response.json();
          pm.expect(json.success).to.be.true;
          pm.expect(json.data).to.be.an('array');
      });
    language: text/javascript
order: 2000
