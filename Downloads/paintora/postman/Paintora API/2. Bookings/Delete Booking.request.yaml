$kind: http-request
description: Admin cancels/deletes a booking.
url: "{{base_url}}/bookings.php?id={{new_booking_id}}"
method: DELETE
queryParams:
  id: "{{new_booking_id}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Delete success confirmation", function () {
          var json = pm.response.json();
          pm.expect(json.success).to.be.true;
      });
    language: text/javascript
order: 5000
