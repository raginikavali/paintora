$kind: http-request
description: Fetches booking status and details by Booking ID.
url: "{{base_url}}/bookings.php?id={{booking_id}}"
method: GET
queryParams:
  id: "{{booking_id}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Response has customer details and service info", function () {
          var json = pm.response.json();
          pm.expect(json.success).to.be.true;
          pm.expect(json.data.id).to.eql(parseInt(pm.collectionVariables.get("booking_id")));
          pm.expect(json.data).to.have.property('status');
          pm.expect(json.data.service).to.have.property('name');
      });
    language: text/javascript
order: 2000
